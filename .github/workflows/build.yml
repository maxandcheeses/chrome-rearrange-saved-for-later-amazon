name: Build extension package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Read version from manifest
        id: version
        run: echo "version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Package extension for the Chrome Web Store
        run: |
          mkdir -p dist
          zip -r "dist/chrome-reorder-saved-for-later-amazon-${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            background.js \
            storage.js \
            popup.html \
            popup.js \
            content.js \
            content.css \
            icons \
            -x '*.DS_Store'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: dist/*.zip

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: Upload build artifact for publish job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: chrome-webstore-package
          path: dist/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-webstore-package
          path: dist

      - name: Publish to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 upload --auto-publish --source "$(ls dist/*.zip)"
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
